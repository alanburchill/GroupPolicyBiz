name: Build and deploy site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '.env'
      - 'content/**'
      - 'scripts/**'
      - 'static/**'
      - 'README.md'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - '.env'
      - 'content/**'
      - 'scripts/**'
      - 'static/**'
      - 'README.md'
      - 'requirements.txt'
      - 'requirements-cloudflare.txt'
      - '.github/workflows/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install staging build dependencies
        run: python -m pip install -r requirements-cloudflare.txt
      - name: Validate Cloudflare staging build
        run: python scripts/build_docs_preview.py --output "$RUNNER_TEMP/grouppolicy-staging" --site-url https://grouppolicy-central-staging.pages.dev
      - name: Validate crawler-facing staging output
        run: python scripts/verify_crawl_output.py "$RUNNER_TEMP/grouppolicy-staging" --origin https://grouppolicy-central-staging.pages.dev

  build-and-deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Load tracked site defaults
        shell: bash
        run: |
          if [ -f .env ]; then
            grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .env >> "$GITHUB_ENV"
          fi

      - name: Generate site
        run: |
          # Optional: Add Google Analytics tracking ID
          # Use --ga-id G-XXXXXXXXXX (GA4) or --ga-id UA-XXXXXXXXX-X (Universal Analytics)
          # Example: python scripts/generate_from_markdown.py --content content/posts --output _site --base-path /GroupPolicyBiz/ --ga-id ${{ secrets.GA_TRACKING_ID }}
          python scripts/generate_from_markdown.py --content content/posts --output _site --base-path "${SITE_BASE_PATH:-/GroupPolicyBiz/}" --site-url "${SITE_URL:-https://alanburchill.github.io}"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5

